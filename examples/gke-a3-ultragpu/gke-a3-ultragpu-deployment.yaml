---
terraform_backend_defaults:
  type: gcs
  configuration:
    bucket: sibug

vars:
  deployment_name: gke-a3-ultra
  project_id: gce-arilg-demo
  region: us-east4
  zone: us-east4-b
  # Cidr block containing the IP of the machine calling terraform.
  # The following line must be updated for this example to work.
  authorized_cidr: 192.168.1.0/24
  # In order to target a BLOCK_NAME, extended_reservation can be inputted as
  # extended_reservation: RESERVATION_NAME/reservationBlocks/BLOCK_NAME
  enabled_flex_start: true 
  enable_queued_provisioning: true 
  static_node_count: 1
  system_node_pool_disk_size_gb: 8 # the size of
  # disk for each node of the system node pool.
  a3ultra_node_pool_disk_size_gb: 8 # the size of
  # disk for each node.
